[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assay-eval"
version = "0.1.0"
description = "Versioned evaluation and deterministic regression gates for language and world models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aneesh Pothuru"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
assay = "assay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

