name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: make lint
      - run: make test
      - run: make demo
      - run: make reproduce-wm
      - run: make reproduce-seeded-regression
      - name: Smoke installed persistence and gate
        run: |
          assay seed-demo --db /tmp/assay-ci.sqlite
          assay runs --db /tmp/assay-ci.sqlite
          set +e
          assay gate --db /tmp/assay-ci.sqlite \
            --baseline demo-baseline \
            --candidate demo-candidate \
            --output /tmp/assay-evidence.json
          status=$?
          set -e
          test "$status" -eq 1
          test -s /tmp/assay-evidence.json
